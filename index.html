<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>room. — Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--stage:#1c1519;--phone:#2b2327;--paper:#f5f3ef;--ink:#252522;--muted:#6b6a63;--line:#e5e3dd;--berry:#cb1941;--berry-soft:#fff0f3;--green:#3e6955;--display:'Bricolage Grotesque','Avenir Next',Georgia,sans-serif;--body:'DM Sans',-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--stage);color:#f3eef0;font-family:var(--body);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 420px at 50% 18%,#cb194133,transparent 70%),radial-gradient(500px 500px at 88% 85%,#7a3a2a2e,transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.stage{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(220px,1fr) 390px minmax(220px,1fr);align-items:center;gap:56px;padding:28px 48px}
.side h1{font-family:var(--display);font-weight:700;font-size:84px;line-height:.9;letter-spacing:-.05em;margin:12px 0 18px}
.side h1 span{color:var(--berry)}
.side p{margin:0;font-size:18px;line-height:1.5;color:#d9ced3;max-width:300px}
.tag{font-size:13px;font-weight:700;color:#ff8da5;letter-spacing:.02em}
.right{justify-self:start;max-width:260px}
.right p{font-size:15px;color:#bfb2b8;line-height:1.55;margin:0 0 20px}
.saved{border:1px solid #ffffff1f;border-radius:14px;padding:14px 16px;font-size:13px}
.saved b{display:block;font-size:13px;margin-bottom:8px}
.saved div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid #ffffff14;color:#bfb2b8}
.saved div span:last-child{color:#fff;text-align:right;overflow-wrap:anywhere}
.saved button{margin-top:10px;font-size:12px;color:#ff8da5;text-decoration:underline}
.phone{position:relative;width:390px;height:min(820px,calc(100vh - 56px));min-height:620px;background:var(--phone);border-radius:52px;padding:10px;box-shadow:0 40px 90px #0008,inset 0 0 0 1px #ffffff14}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:128px;height:28px;background:var(--phone);border-radius:0 0 18px 18px;z-index:5}
.screen{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;border-radius:42px;background:var(--paper);color:var(--ink);scroll-behavior:smooth;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:42px 22px 12px;background:linear-gradient(var(--paper) 75%,#f5f3ef00)}
.back{font-size:13px;color:var(--muted);min-height:44px;padding-right:10px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:22px;height:3px;border-radius:3px;background:#e0ded7}
.dots i.on{background:var(--berry)}
.dots small{font-size:11px;color:var(--muted);margin-left:6px}
.pad{padding:6px 24px 24px}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.02;letter-spacing:-.045em;margin:6px 0 10px}
.lead{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 18px}
.hero{position:relative;min-height:600px;padding:76px 24px 24px;background:radial-gradient(300px 260px at 100% 0,#cb194138,transparent 70%),radial-gradient(260px 260px at 0 100%,#e9c9a233,transparent 70%);display:flex;flex-direction:column}
.hero .brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.06em}
.hero .brand span,.dotc{color:var(--berry)}
.hero h2{font-size:48px;margin:auto 0 14px;letter-spacing:-.055em}
.hero .hint{margin-top:22px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin:0 20px 14px}
.card h3{font-family:var(--display);font-size:22px;line-height:1.1;letter-spacing:-.04em;margin:12px 0 8px}
.card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.card img{display:block;width:100%;height:150px;object-fit:cover;border-radius:14px}
.ico{width:42px;height:42px;border-radius:12px;background:var(--berry-soft);display:grid;place-items:center}
.ico svg{width:22px;height:22px;stroke:var(--berry);fill:none;stroke-width:1.7;stroke-linejoin:round}
.cta-wrap{position:sticky;bottom:0;padding:16px 20px 22px;background:linear-gradient(#f5f3ef00,var(--paper) 28%);z-index:3}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 20px;border-radius:14px;background:var(--berry);color:#fff;font-weight:700;font-size:15px;transition:background .15s,transform .15s}
.cta:hover{background:#b11135}.cta:active{transform:translateY(1px)}
.cta:disabled{opacity:.6;cursor:wait}
.ghost{width:100%;min-height:46px;margin-top:8px;border-radius:12px;background:#ebe9e3;font-size:13px;font-weight:500}
.link{display:block;margin:12px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;min-height:32px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}
input[type=text],input[type=email]{width:100%;min-height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;color:var(--ink)}
input:focus{border-color:var(--berry);outline:0}
.err{color:var(--berry);font-size:12px;min-height:16px;margin:6px 0 0}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.45;margin-top:18px;font-weight:400}
.consent input{margin-top:2px;accent-color:var(--berry);width:18px;height:18px;flex:none}
.tiny{font-size:11px;color:#8d8c84;line-height:1.5;margin:10px 0 0;text-align:center}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin:6px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row small{color:var(--green);font-size:12px}
.photo{position:relative;border-radius:18px;overflow:hidden;background:#e9e6df}
.photo img{display:block;width:100%;height:190px;object-fit:cover}
.sweep{position:absolute;left:0;right:0;height:2px;background:var(--berry);box-shadow:0 0 22px var(--berry);animation:sw 1.2s ease-in-out infinite alternate}
@keyframes sw{from{top:6%}to{top:94%}}
.big{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1}
input[type=range]{width:100%;accent-color:var(--berry);height:28px;margin:10px 0 0}
.rl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-size:13px;min-height:44px;color:#6f6d64}
.chip.on{border-color:var(--berry);background:var(--berry-soft);color:var(--berry);font-weight:700}
.sec{font-size:13px;font-weight:700;margin:20px 0 10px;display:flex;justify-content:space-between}
.sec small{font-weight:400;color:var(--muted)}
.look{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.look.on{border-color:var(--berry)}
.look img{width:92px;height:70px;object-fit:cover;border-radius:10px;flex:none}
.look h3{margin:0;font-size:15px;font-family:var(--display);letter-spacing:-.02em}
.look p{margin:2px 0 4px;font-size:12px;color:var(--muted)}
.radio{margin-left:auto;margin-right:6px;width:18px;height:18px;border-radius:50%;border:1.5px solid #cfcdc5;flex:none}
.look.on .radio{border-color:var(--berry);background:radial-gradient(var(--berry) 45%,transparent 50%)}
.status{font-size:12px;color:var(--green);margin:8px 0 0}.status.over{color:var(--berry)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sw{width:44px;height:44px;border-radius:12px;flex:none}
.item h3{margin:0;font-size:14px}.item p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.item a{font-size:11.5px;color:var(--berry);display:inline-block;margin-top:4px;min-height:20px}
.item .pr{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;font-size:14px}
.swap{font-size:12px;font-weight:700;color:var(--berry);min-height:36px;padding:0 0 0 10px}
.total{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--ink);padding-top:14px;margin-top:2px;font-size:13px}
.total strong{font-family:var(--display);font-size:30px;letter-spacing:-.05em}
.sheet{position:absolute;inset:10px;z-index:8;border-radius:42px;background:#14101266;display:flex;align-items:flex-end;overflow:hidden}
.sheet>div{width:100%;background:var(--paper);color:var(--ink);border-radius:26px 26px 42px 42px;padding:22px 20px 30px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;min-height:60px}
.opt.on{border-color:var(--berry)}.opt b{font-size:14px}.opt small{display:block;color:var(--muted);font-size:11.5px}
.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);background:#252522;color:#fff;font-size:12px;padding:10px 16px;border-radius:30px;opacity:0;transition:.25s;z-index:9;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:1060px){.stage{grid-template-columns:1fr;justify-items:center;gap:22px;padding:20px 0}.side{display:none}.phone{width:100%;max-width:420px}}
@media (max-width:480px){.stage{padding:0}.phone{height:100vh;min-height:0;border-radius:0;padding:0}.screen,.sheet,.sheet>div{border-radius:0}.notch{display:none}.bar{padding-top:20px}.hero{padding-top:40px}.sheet{inset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.sw{object-fit:cover;display:block}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--berry);background:var(--berry-soft);border:1px solid #f3c3cf;border-radius:20px;padding:2px 8px;margin:0 0 4px}
.opt.partner{border-color:var(--berry);background:var(--berry-soft)}
.opt .pn{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 4px}
.notice{display:flex;gap:10px;background:#fff7e6;border:1px solid #f0dcae;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#5c4a12;margin:0 0 14px}
.privacy{display:flex;gap:10px;background:#eef5f0;border:1px solid #cfe3d6;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:#2c4a3a;margin:0 0 4px}
.soonrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;background:#fff;border:1.5px dashed #cfcdc5;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px;font-weight:500}
.soonrow .ico{flex:none}.soonrow span.t{flex:1}
.soon{font-size:10.5px;font-weight:700;background:#ebe9e3;color:var(--muted);border-radius:20px;padding:3px 9px;flex:none}
.keepimg{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none}
.emoji{font-size:44px;line-height:1;display:block;margin-bottom:10px}
.cta.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink);margin-top:10px}
.cta.alt:hover{background:#f1efe9}
.badge.sp{color:#6a5410;background:#fff4d6;border-color:#ecd48c;letter-spacing:.01em}
.notice.sp{background:#fffaf0;border-color:#ecd48c;color:#5c4a12;margin:0 0 10px}
.opt.sponsored{border-color:#ecd48c;background:#fffaf0}
.item.sprow{background:#fffaf0;border:1.5px solid #ecd48c;border-radius:14px;padding:12px;margin:8px 0}
.spbanner{margin:0 0 14px}.spbanner b{display:block;margin-bottom:4px}.spbanner ul{margin:6px 0 8px;padding-left:18px}.spbanner li{margin:2px 0}.spbanner button{font-weight:700;text-decoration:underline;font-size:12px;min-height:32px;color:#5c4a12}
.grp{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.spcard{background:#fffaf0;border:1.5px solid #ecd48c;border-radius:16px;padding:12px;margin:0 0 10px}
.spcard .item{border-top:0;padding:0}
.spcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mini{min-height:38px;padding:0 14px;border-radius:10px;background:#fff;border:1.5px solid var(--ink);font-size:12.5px;font-weight:700}
.mini.fill{background:var(--ink);color:#fff}
.mini:disabled{opacity:.6;cursor:default}
.lnk{font-size:12px;color:var(--muted);text-decoration:underline;min-height:32px;display:inline-flex;align-items:center}
.plsheet{max-height:100%;overflow-y:auto;scrollbar-width:none}
#layout-canvas{display:block;width:100%;height:290px;background:radial-gradient(ellipse,#f9f8f3,#eaece4);border:1px solid #e4e6dd;border-radius:16px;touch-action:none;cursor:grab}
.pl-view{display:flex;align-items:center;gap:6px;margin:8px 0}.pl-view .chip{min-height:38px;padding:8px 12px}.pl-view .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.pl-view span{margin-left:auto;font-size:10.5px;color:var(--muted)}
.pl-cam{display:flex;gap:14px;margin:10px 0 12px}.pl-cam label{display:flex;align-items:center;gap:8px;font-size:11.5px;flex:1;margin:0;font-weight:500}.pl-cam input{min-width:0}
.pl-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.pl-ctl>div{flex:1;min-width:110px}.pl-ctl strong{display:block;font-size:14px}.pl-ctl small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.pl-ctl label{font-size:11px;display:flex;gap:6px;align-items:center;margin:0;font-weight:500;flex:1}.pl-ctl input[type=number]{width:100%;min-width:60px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;background:#fff}
.pl-act{display:flex;gap:10px;align-items:stretch;margin-top:12px}.pl-act>*{flex:1}
.pl-prev{background:#eceae2}.pl-prev canvas{display:block;width:100%;height:auto}
.stat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--green);margin-left:6px}
</style></head><body>
<main class="stage">
<aside class="side"><div class="tag">Interactive demo</div><h1>room<span>.</span></h1><p>Your room, your way. We search big and local stores so you don’t have to.</p></aside>
<div class="phone"><div class="notch"></div><div class="screen" id="screen"></div><div id="sheet"></div><div class="toast" id="toast" role="status"></div></div>
<aside class="side right"><p>Interactive prototype — products, prices and data are fictional.</p><div class="saved"><b>🔒 We don’t keep your data</b><div style="display:block;border:0;padding:0;line-height:1.5"><span id="privtxt">Nothing you type is stored or sent anywhere. Refresh the page and it’s gone.</span></div></div></aside>
</main>

partner:()=>bar()+'<div class="pad"><h2>Be the best option, right when people choose.</h2><div class="notice"><span aria-hidden="true">🛠️</span><span><b>Demo only.</b> The partner space isn’t open yet. This is a preview of what it will offer.</span></div><p class="lead">room. searches home and furniture stores, big and local, for each person’s room, style and budget. Sponsored placements are always labelled and sit right next to non-sponsored options.</p><div class="sec" style="margin-top:4px">How a partner pick looks to people</div><div class="box"><div class="item" style="border-top:0"><img class="sw" src="'+TH.rug[1]+'" alt=""><div><h3>Rust flatweave rug</h3><p>160 × 230 cm · H&amp;M Home</p><span class="badge sp">Sponsored</span></div><div class="pr"><b>€159</b></div></div></div><div class="card" style="margin:0 0 12px">'+ic('compass')+'<h3>Get referenced where it counts.</h3><p>People arrive with their room, budget and style already defined. Your product is shown at the exact moment they swap a piece.</p></div><div class="card" style="margin:0 0 12px">'+ic('list')+'<h3>Shown first, clearly labelled.</h3><p>Sponsored picks appear in a labelled slot at the top of a swap list, with non-sponsored options right below. We always tell people when a placement is sponsored.</p></div><div class="card" style="margin:0 0 12px">'+ic('search')+'<h3>Built on real intent.</h3><p>Every swap comes from someone refreshing a real room, within a real budget.</p></div></div>'+cta('Talk to us','info:partner')+'<button class="cta alt" data-act="go:login">See the experience people get</button></div>',
home:()=>'<section class="hero"><div class="brand">room<span>.</span></div><h2>Your room, your way.</h2><p class="lead">You tell us what you want. We search home and furniture stores, from big names to local brands, for you, so you get exactly what you’re after.</p><div class="hint"><span aria-hidden="true">↓</span> Scroll to see how</div></section>'
+'<div class="card">'+ic('search')+'<h3>We search big and local stores, so you don’t have to.</h3><p>One place instead of twenty tabs. We compare big and local stores and bring back only what fits your room, your style and your budget.</p></div>'
+'<div class="card">'+ic('list')+'<h3>Save hours of scrolling.</h3><p>Skip the endless browsing. You answer a few questions and get a ready-to-shop plan in about two minutes.</p></div>'
+'<div class="card">'+ic('sofa')+'<h3>Keep what you love.</h3><p>Your sofa, your coffee table: you keep them, and we build around them. No need to start over.</p></div>'
+'<div class="card">'+ic('compass')+'<h3>Exactly what you want.</h3><p>Three moods for the same room. You compare, you choose, you swap any piece until it feels like you.</p><div style="height:12px"></div><img src="'+IMG.warm+'" alt="Living room in the Warm modern mood"></div><div style="height:150px"></div>'+cta('I want to see everything','go:login')+'<button class="cta alt" data-act="go:partner">I’m a business — show me the partner space</button></div>',
login:()=>bar()+'<div class="pad"><h2>Welcome.</h2><p class="lead">Create a profile, or skip it. Both work.</p><div class="privacy"><span aria-hidden="true">🔒</span><span id="privlogin"><b>We don’t keep your data.</b> What you type stays on this page and disappears when you refresh or close it.</span></div><form id="f" novalidate><label for="n">First name</label><input id="n" type="text" autocomplete="given-name" value="'+esc(S.name)+'"><label for="e">Email</label><input id="e" type="email" autocomplete="email" value="'+esc(S.email)+'"><p class="err" id="err" role="alert">'+S.err+'</p></form></div>'+cta('Create my profile','login')+'<button class="cta alt" data-act="go:scan">Continue without an account</button></div>',
scan:()=>{const a=S.scanning,b=S.scanned;return bar()+'<div class="pad"><h2>First, the big picture.</h2><div class="notice"><span aria-hidden="true">🛠️</span><span><b>Demo only.</b> Room scanning isn’t ready yet. For now, you’ll explore the experience with a sample room.</span></div><p class="lead">'+(S.name?esc(S.name)+', a':'A')+' scan will help us work around your room and the furniture you already love.</p><div class="photo"><img src="'+IMG.room+'" alt="Sample living room with a cream sofa and oak coffee table" style="'+(b||a?'':'filter:grayscale(1) opacity(.45)')+'">'+(a?'<div class="sweep"></div>':'')+'</div><div class="box" style="margin-top:14px"><div class="row"><span>Room dimensions</span><small>'+(a?'Mapping…':b?'4.2 × 3.6 m':'Ready to scan')+'</small></div><div class="row"><span>Existing furniture</span><small>'+(a?'Looking…':b?'2 pieces found':'Sofa + coffee table')+'</small></div><div class="row"><span>Windows &amp; walking space</span><small>'+(b?'Sample layout loaded':'Included in sample')+'</small></div></div><p class="tiny">Simulated scan · dimensions are sample data</p></div>'+cta(a?'Reading your room…':b?'Set my preferences':'Scan my room',b?'go:prefs':'scan',a)},
prefs:()=>bar()+'<div class="pad"><h2>What matters to you?</h2><p class="lead">A fresh look doesn’t need a fresh start.</p><div class="sec"><label for="bud" style="margin:0">Your total budget</label><small>Accessories only</small></div><div class="big" id="bv">'+eur(S.budget)+'</div><input id="bud" type="range" min="250" max="1000" step="25" value="'+S.budget+'"><div class="rl"><span>€250</span><span>€1,000</span></div><div class="sec">Your priority</div><div class="chips">'+PRIO.map(p=>'<button class="chip '+(S.prio===p[1]?'on':'')+'" data-act="prio:'+p[1]+'" aria-pressed="'+(S.prio===p[1])+'">'+p[0]+'</button>').join('')+'</div><div class="sec">Working with what you own</div><div class="box"><div class="row"><span style="display:flex;align-items:center;gap:10px"><img class="keepimg" src="'+TH.sofa+'" alt="">Cream sofa</span><small>✓ Keeping</small></div><div class="row"><span style="display:flex;align-items:center;gap:10px"><img class="keepimg" src="'+TH.table+'" alt="">Oak coffee table</span><small>✓ Keeping</small></div></div><button class="soonrow" data-act="info:furniture">'+ic('plus')+'<span class="t">Add other furniture I already like</span><span class="soon">Soon</span></button></div>'+cta(S.editing?'Apply budget':'Find my room’s next look',S.editing?'apply':'pick'),
looks:()=>{const l=LOOKS[S.look];return bar()+'<div class="pad"><h2>Pick your mood.</h2><p class="lead">Same sofa. Same table. A different feeling. Choose a direction, or tell us your own.</p><div class="photo" style="margin-bottom:14px"><img src="'+IMG[l.img]+'" alt="Preview of the '+l.n+' mood"></div>'+LOOKS.map((x,i)=>'<button class="look '+(S.look===i?'on':'')+'" data-act="look:'+i+'" aria-pressed="'+(S.look===i)+'"><img src="'+IMG[x.img]+'" alt=""><span><h3>'+x.n+'</h3><p>'+x.d+'</p><b style="font-size:13px">'+eur(KEYS.reduce((n,k)=>n+CAT[k][x.c[k]].p,0))+'</b> <small style="color:var(--muted);font-size:10px">/ 4 additions</small></span><span class="radio"></span></button>').join('')+status()+'<div class="sec" style="margin-top:22px">Or go your own way</div><button class="soonrow" style="margin-top:0" data-act="info:describe">'+ic('pen')+'<span class="t">Describe exactly what you want</span><span class="soon">Soon</span></button><button class="soonrow" data-act="info:photo">'+ic('cam')+'<span class="t">Import my theme from a photo</span><span class="soon">Soon</span></button></div>'+cta('Make this mood mine','go:tweak')},
tweak:()=>bar()+'<div class="pad"><h2>Make it your kind of room.</h2><p class="lead">'+LOOKS[S.look].n+' is your starting point. Swap an item to find your balance.</p>'+items(true)+'<div class="total"><span>4 additions · your total</span><strong>'+eur(total())+'</strong></div>'+status()+arrangeBlock(false)+spBlock()+'</div>'+cta('See my shopping plan','go:plan')+'<button class="ghost" data-act="budget">Adjust my budget</button></div>',
plan:()=>bar()+'<div class="pad"><h2>A little plan. A big difference.</h2><p class="lead">Your '+LOOKS[S.look].n.toLowerCase()+' edit, ready to save. Keep your sofa and table, and add these four pieces.</p>'+planSpBanner()+arrangeBlock(true)+items(false)+'<div class="total"><span>Your room refresh</span><strong>'+eur(total())+'</strong></div>'+status()+'<p class="tiny">Example products and estimated prices, excluding delivery. Links open searches for similar items. Items marked “Sponsored” are paid placements.</p></div>'+cta('Save my room plan','save')+'<button class="ghost" data-act="go:tweak">Keep refining my room</button><button class="link" data-act="restart">Start over</button></div>',
ask:()=>{
 if(S.sent)return bar()+'<div class="pad"><span class="emoji" aria-hidden="true">🙏</span><h2>Thank you.</h2><p class="lead">That helps us decide what to build next. '+(FEEDBACK_URL?'Your answer was saved anonymously.':'This is a demo, so nothing was sent anywhere.')+'</p></div>'+'<div class="cta-wrap"><button class="cta" data-act="go:plan">Back to my plan<span aria-hidden="true">→</span></button><button class="cta alt" data-act="restart">Start over</button></div>';
 return bar()+'<div class="pad"><h2>One last question.</h2><p class="lead">So far you used a sample room. Imagine the next step: you move your phone around your <b>own</b> room so the app can measure it and spot the furniture you keep.</p>'
 +'<div class="sec" style="margin-top:6px" id="q1">How comfortable would you feel scanning your own room with an app like this?</div><div role="radiogroup" aria-labelledby="q1">'
 +ASK.map((t,i)=>'<button class="opt '+(S.ans===i?'on':'')+'" role="radio" aria-checked="'+(S.ans===i)+'" data-act="ans:'+i+'"><span class="pn"><b>'+t+'</b></span></button>').join('')+'</div>'
 +(S.ans!==null?'<div class="sec" style="margin-top:22px">What matters most to you here? <small>Optional · pick any</small></div><div class="chips">'+WHY.map((t,i)=>'<button class="chip '+(S.why.includes(i)?'on':'')+'" data-act="why:'+i+'" aria-pressed="'+S.why.includes(i)+'">'+t+'</button>').join('')+'</div>':'')
 +'<p class="tiny">'+(FEEDBACK_URL?'Your answer is saved anonymously, with no name or email.':'Demo: your answer stays on this page and isn’t sent anywhere.')+'</p></div>'
 +cta('Send my answer','send',S.ans===null)+'<button class="link" data-act="restart">Skip and start over</button></div>'}
};
function privLogin(){const el=document.getElementById('privlogin');if(el&&FEEDBACK_URL)el.innerHTML='<b>We don’t keep your name or email.</b> They stay on this page. We only record anonymous usage (screens, choices, final answers) under a random ID.'}
function render(reset){const sc=$('#screen'),y=sc.scrollTop;sc.innerHTML=V[S.step]();sc.scrollTop=reset?0:y;privLogin();if(S.step==='plan')drawConfirmed($$('cp'));renderSheet();
 const b=$('#bud');if(b)b.oninput=e=>{S.budget=+e.target.value;$('#bv').textContent=eur(S.budget)}}
function renderSheet(){const s=S.sheet,el=$('#sheet');if(!s){if(plannerObs){plannerObs.disconnect();plannerObs=null}el.innerHTML='';return}
 if(s.t==='planner')return;
 if(s.t==='info'){const f=INFO[s.k];el.innerHTML='<div class="sheet" data-act="close"><div data-stop><span class="emoji" aria-hidden="true">'+f.e+'</span><h2 style="font-size:26px">'+f.h+'</h2><p class="lead" style="margin-bottom:16px">'+f.p+'</p>'+(f.act?'<button class="cta" data-act="'+f.act+'">'+f.btn+'<span aria-hidden="true">→</span></button><button class="ghost" data-act="close">Cancel</button>':'<button class="cta" data-act="close">Got it</button>')+'</div></div>';return}
 const k=s.k,sp=SPON[k],has=sp!==undefined,showSp=has&&!S.hideSp,cur=CAT[k][S.choices[k]].p;
 const row=i=>{const v=CAT[k][i],dl=v.p-cur,isSp=i===sp;return '<button class="opt '+(isSp?'sponsored ':'')+(S.choices[k]===i?'on':'')+'" data-act="pick2:'+k+':'+i+'"><img class="sw" src="'+TH[k][i]+'" alt=""><span class="pn">'+(isSp?'<span class="badge sp">Sponsored</span><br>':'')+'<b>'+v.n+'</b><small>'+v.d+' · '+v.r+'</small><small>'+(S.choices[k]===i?'Selected':(dl>=0?'+':'−')+eur(Math.abs(dl))+' to your total')+'</small></span><b>'+eur(v.p)+'</b></button>'};
 const others=[0,1,2].filter(i=>i!==sp||!has);
 const hiddenButSelected=has&&S.hideSp&&S.choices[k]===sp;
 el.innerHTML='<div class="sheet" data-act="close"><div data-stop><h2 style="font-size:26px;margin-bottom:2px">Choose your '+NAME[k]+'.</h2>'
 +'<p class="note">'+(has?'One option here is <b>sponsored</b>: a retailer pays room. to feature it. It’s labelled and kept apart from the others, which are not sponsored.':'No sponsored options in this category. All options below are not sponsored.')+'</p>'
 +(showSp?'<div class="grp">Sponsored</div>'+row(sp)+'<div class="grp">Other options · not sponsored</div>':(has?(hiddenButSelected?'<div class="grp">Your current choice · sponsored</div>':'')+(hiddenButSelected?row(sp):'')+'<div class="grp">Options · not sponsored</div>':''))
 +''
 +others.map(row).join('')
 +(has?'<button class="lnk" data-act="'+(S.hideSp?'sp:show':'sp:hide')+'">'+(S.hideSp?'Show the sponsored option':'Hide the sponsored option')+'</button>':'')
 +'<p class="tiny">Photos are style references from the room design, not the exact products.</p><button class="ghost" data-act="close">Close</button></div></div>'}
function go(s){S.step=s;S.err='';log('view',{step:s});render(true)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function login(){const n=$('#n').value.trim(),e=$('#e').value.trim();S.name=n;S.email=e;
 if(!n)S.err='Enter your first name.';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))S.err='Enter a valid email address.';
 else{S.err='';toast('Welcome, '+n);go('scan');return}
 render()}
function download(){const t='ROOM — MY ROOM PLAN\n\n'+LOOKS[S.look].n+'\nSample living room: 4.2 × 3.6 m\nKeep: existing cream sofa + oak coffee table\nBudget: '+eur(S.budget)+'\n\n'+KEYS.map(k=>{const v=CAT[k][S.choices[k]];return v.n+(S.choices[k]===SPON[k]?' [SPONSORED]':'')+' — '+eur(v.p)+'\n'+v.d+'\nBrowse similar at '+v.r+': '+url(k,v)}).join('\n\n')+'\n\nTotal: '+eur(total())+'\nExample products and estimated prices, excluding delivery. Items marked [SPONSORED] are paid placements.\n'+layoutText();
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='my-room-plan.txt';a.click();toast('Plan saved')}
document.addEventListener('submit',e=>{e.preventDefault();login()});
function send(){S.sent=true;log('survey',{scanComfort:ASK[S.ans],scanComfortScore:5-S.ans,concerns:S.why.map(i=>WHY[i])});render(true)}
document.addEventListener('submit',e=>{e.preventDefault();login()});
document.addEventListener('click',e=>{const lk=e.target.closest('a[data-k]');if(lk){if(lk.dataset.sp){S.spClicks++;log('sponsored_click',{category:lk.dataset.k})}else log('retailer_click',{category:lk.dataset.k})}const el=e.target.closest('[data-act]');if(!el)return;if(el.classList.contains('sheet')&&e.target.closest('[data-stop]'))return;
 const [a,x,y]=el.dataset.act.split(':');
 if(a==='go')go(x);
 else if(a==='back'){if(S.step==='prefs'&&S.editing){S.editing=false;go('tweak')}else go(BACK[S.step])}
 else if(a==='login')login();
 else if(a==='arrange'){openPlanner()}
 else if(a==='info'){log('info_open',{topic:x});S.sheet={t:'info',k:x};renderSheet()}
 else if(a==='scan'){log('scan_tap');S.sheet={t:'info',k:'scan'};renderSheet()}
 else if(a==='scanrun'){log('scan_demo_continue');S.sheet=null;S.scanning=true;render();setTimeout(()=>{S.scanning=false;S.scanned=true;render();toast('Demo room ready · 2 pieces found')},2400)}
 else if(a==='prio'){S.prio=+x;log('priority',{priority:PRIO[S.prio][0]});render()}
 else if(a==='pick'){log('preferences_done',{budget:S.budget,priority:PRIO[S.prio][0]});S.look=S.prio;S.choices={...LOOKS[S.look].c};go('looks')}
 else if(a==='apply'){S.editing=false;go('tweak')}
 else if(a==='look'){log('mood',{mood:LOOKS[+x].n});S.look=+x;S.choices={...LOOKS[S.look].c};render()}
 else if(a==='swap'){log('swap_open',{category:x,sponsoredShown:SPON[x]!==undefined&&!S.hideSp});S.sheet={t:'swap',k:x};renderSheet()}
 else if(a==='pick2'){log('swap_pick',{category:x,sponsored:+y===SPON[x],source:S.sheet?'sheet':'sponsored_card'});if(+y===SPON[x]&&S.choices[x]!==+y)S.spAdded++;S.choices[x]=+y;S.sheet=null;render();toast('Updated · new total '+eur(total()))}
 else if(a==='close'){S.sheet=null;renderSheet()}
 else if(a==='budget'){log('budget_edit');S.editing=true;go('prefs')}
 else if(a==='save'){log('plan_saved',{mood:LOOKS[S.look].n,total:total(),budget:S.budget,sponsoredInPlan:KEYS.filter(k=>S.choices[k]===SPON[k]),hidSponsored:S.hideSp});download();go('ask')}
 else if(a==='sp'){log(x==='hide'?'sponsored_hide':'sponsored_show',{where:S.sheet?'sheet':'tweak'});S.hideSp=(x==='hide');render();if(S.sheet)renderSheet()}
 else if(a==='ans'){S.ans=+x;log('survey_select',{scanComfort:ASK[S.ans]});render()}
 else if(a==='why'){const i=+x,p=S.why.indexOf(i);if(p<0){S.why.push(i);if(i===4)S.why=[4];else S.why=S.why.filter(j=>j!==4)}else S.why.splice(p,1);render()}
 else if(a==='send')send();
 else if(a==='restart'){roomLayout.pieces=null;roomLayout.confirmed=null;if(S.step==='ask'&&!S.sent)log('survey_skipped');else log('restart');S.scanned=false;S.editing=false;S.hideSp=false;S.ans=null;S.why=[];S.sent=false;S.spClicks=0;S.spAdded=0;go('home')}
});
if(FEEDBACK_URL)document.getElementById('privtxt').textContent='Your name and email never leave this page. We record anonymous usage (screens visited, choices made, your final answers) with a random ID, to improve the prototype.';
log('session_start',{viewport:innerWidth<=480?'mobile':'desktop'});
render(true);
</script></body></html>
